# Coordinates are in mm from the board's top-left corner, x to the right and
# y downward, everything seen from the top (component) side.
#
# outline: the board edge as corner points, clockwise from the top-left.
#   Straight edges only - cuts/chamfers are just extra points.
#
# connectors: 2-row pin headers.
#   name       Label shown next to pin 1 (e.g. J1).
#   at         Centre of pin 1, in mm.
#   rotation   0 | 90 | 180 | 270, clockwise. At 0 the header runs to the
#              right from pin 1 with the second row below it; other values
#              rotate that around pin 1 (90: runs down, second row to the
#              left of pin 1's row).
#   pitch      Pin spacing in mm, optional (default 2.54).
#   pin_count  Total pins (both rows), optional - defaults to the highest
#              listed pin number. Unlisted pins are drawn as not connected.
#   pins       Numbered zigzag across the rows: odd pins in pin 1's row,
#              even pins in the other one.
#              kind: gpio   + port_pin (e.g. PB2) - selectable, same pin as
#                                                   in the SoC view
#                    power  + label (e.g. 3V3)
#                    ground + label (e.g. GND)
#                    nc       not connected
outline:
  - [0, 0]
  - [92, 0]
  - [92, 68]
  - [70, 68]
  - [68, 70]
  - [0, 70]

connectors:
  - name: J7
    at: [22, 23] # x = actual x + 3
    rotation: 90
    pitch: 2.54
    pin_count: 36
    pins:
